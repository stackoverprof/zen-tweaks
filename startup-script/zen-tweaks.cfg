// Zen: show only the domain (e.g. youtube.com) in the top toolbar's address text.
// Remove this file and defaults/pref/autoconfig.js from Zen.app to undo.
try {
  const patch = win => {
    const bar = win.gURLBar;
    if (!bar || bar._zenDomainOnly) {
      return;
    }
    const original = bar._zenTrimURL;
    if (typeof original !== "function") {
      return false;
    }
    bar._zenDomainOnly = true;
    bar._zenTrimURL = value => {
      const full = original(value);
      if (bar.focused || bar.hasAttribute("breakout-extend") || typeof value !== "string") {
        return full;
      }
      if (!/^https?:\/\//i.test(value)) {
        return full;
      }
      try {
        return new win.URL(value).hostname.replace(/^www\./i, "") || full;
      } catch (e) {
        return full;
      }
    };
    const refresh = () => {
      if (!bar.valueIsTyped) {
        bar.handleRevert();
      }
    };
    bar.inputField.addEventListener("focus", refresh);
    bar.inputField.addEventListener("blur", refresh);
    refresh();
    return true;
  };

  // Page-coloured toolbar: sample the top row of the visible page and expose it
  // to CSS as --zen-page-top-color / --zen-page-top-fg (like Arc).
  const startPageColor = win => {
    const root = win.document.documentElement;
    const canvas = win.document.createElementNS("http://www.w3.org/1999/xhtml", "canvas");
    canvas.width = 64;
    canvas.height = 1;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    let busy = false;
    let last = "";
    const EMPTY = "empty";
    const sample = async () => {
      if (busy || win.closed || win.document.hidden) {
        return;
      }
      const browser = win.gBrowser?.selectedBrowser;
      const wg = browser?.browsingContext?.currentWindowGlobal;
      if (!wg || !browser.clientWidth) {
        return;
      }
      // A blank tab (a search opening a new tab sits on about:blank while it loads) has no tint, and its
      // snapshot reads as white. Use the empty-page grey instead, and keep it until that load finishes.
      const spec = browser.currentURI?.spec || "";
      const blank = spec === "about:blank" || spec.startsWith("about:newtab") || spec.startsWith("about:home");
      if (blank || (last === EMPTY && win.gBrowser.selectedTab?.hasAttribute("busy"))) {
        if (last !== EMPTY) {
          last = EMPTY;
          root.style.setProperty("--zen-page-top-color", "light-dark(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.1))");
          root.style.setProperty("--zen-page-top-fg", "light-dark(rgb(28, 28, 30), rgb(235, 235, 240))");
          root.setAttribute("zen-page-color", "empty");
        }
        return;
      }
      busy = true;
      try {
        const w = browser.clientWidth;
        const bmp = await wg.drawSnapshot(new win.DOMRect(0, 0, w, 1), 1, "white");
        ctx.drawImage(bmp, 0, 0, w, 1, 0, 0, 64, 1);
        bmp.close?.();
        const d = ctx.getImageData(0, 0, 64, 1).data;
        const counts = new Map();
        for (let i = 0; i < 64; i++) {
          const k = (d[i * 4] >> 3) + "," + (d[i * 4 + 1] >> 3) + "," + (d[i * 4 + 2] >> 3);
          const c = counts.get(k) || { n: 0, i };
          c.n++;
          counts.set(k, c);
        }
        let best = null;
        for (const c of counts.values()) {
          if (!best || c.n > best.n) {
            best = c;
          }
        }
        const r = d[best.i * 4], g = d[best.i * 4 + 1], b = d[best.i * 4 + 2];
        const color = `rgb(${r}, ${g}, ${b})`;
        if (color !== last) {
          last = color;
          const lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
          root.style.setProperty("--zen-page-top-color", color);
          root.style.setProperty("--zen-page-top-fg", lum > 0.6 ? "rgb(28, 28, 30)" : "rgb(245, 245, 247)");
          root.setAttribute("zen-page-color", lum > 0.6 ? "light" : "dark");
        }
      } catch (e) {
        // page not paintable yet (about: pages, loading) — keep the last colour
      } finally {
        busy = false;
      }
    };
    win.gBrowser.tabContainer.addEventListener("TabSelect", () => win.setTimeout(sample, 50));
    win.gBrowser.addTabsProgressListener({
      onStateChange(browser, progress, request, flags) {
        if (browser === win.gBrowser.selectedBrowser && flags & Ci.nsIWebProgressListener.STATE_STOP) {
          win.setTimeout(sample, 100);
        }
      },
    });
    win.setInterval(sample, 1000);
    sample();
  };

  // Compact mode with the top toolbar: Zen puts the traffic lights in the toolbar.
  // Move them to the top-left of the floating sidebar instead (above the essentials).
  const sidebarWindowButtons = win => {
    const vt = win.gZenVerticalTabsManager;
    const doc = win.document;
    if (!vt || vt._claudeButtonsPatched) {
      return;
    }
    vt._claudeButtonsPatched = true;
    const place = () => {
      const root = doc.documentElement;
      const compact = root.getAttribute("zen-compact-mode") === "true";
      const single = root.getAttribute("zen-single-toolbar") === "true";
      const buttons = vt.actualWindowButtons;
      const titlebar = doc.getElementById("titlebar");
      if (!buttons || !titlebar) {
        return;
      }
      let slot = doc.getElementById("zen-sidebar-window-buttons");
      if (compact && !single) {
        if (!slot) {
          slot = doc.createXULElement("hbox");
          slot.id = "zen-sidebar-window-buttons";
          titlebar.prepend(slot);
        }
        // traffic lights: always at the toolbar's left (the sidebar keeps only its toggle)
        const navbar = doc.getElementById("nav-bar");
        let navSlot = doc.getElementById("zen-navbar-window-buttons");
        if (!navSlot && navbar) {
          navSlot = doc.createXULElement("hbox");
          navSlot.id = "zen-navbar-window-buttons";
          navbar.prepend(navSlot);
        }
        const target = navSlot || slot;
        if (buttons.parentNode !== target) {
          target.prepend(buttons);
        }
        // the sidebar toggle sits at the sidebar's top-left
        const toggle = doc.getElementById("zen-sidebar-top-buttons");
        if (toggle && toggle.parentNode !== slot) {
          slot.append(toggle);
        }
      } else if (slot) {
        const toggle = doc.getElementById("zen-sidebar-top-buttons");
        if (toggle && toggle.parentNode === slot) {
          titlebar.prepend(toggle);  // keep it alive; Zen re-places it on its next update
        }
        doc.getElementById("zen-navbar-window-buttons")?.remove();
        slot.remove();  // Zen's own update has already put the buttons back where it wants them
      }
    };
    const orig = vt._updateEvent.bind(vt);
    vt._updateEvent = function (...args) {
      const r = orig(...args);
      Promise.resolve(r).finally(() => win.setTimeout(place, 0));
      return r;
    };
    new win.MutationObserver(() => win.setTimeout(place, 0))
      .observe(doc.documentElement, { attributes: true, attributeFilter: ["zen-compact-mode", "zen-single-toolbar"] });
    win.setTimeout(place, 500);
  };

  const tryPatch = (win, attempt = 0) => {
    if (attempt === 0) {
      try {
        sidebarWindowButtons(win);
      } catch (e) {
        Components.utils.reportError("zen-sidebar-buttons: " + e);
      }
      try {
        startPageColor(win);
      } catch (e) {
        Components.utils.reportError("zen-page-color: " + e);
      }
    }
    if (patch(win) === false && attempt < 50) {
      win.setTimeout(() => tryPatch(win, attempt + 1), 200);
    }
  };

  Services.obs.addObserver(subject => {
    if (subject?.document?.documentElement?.getAttribute("windowtype") === "navigator:browser") {
      tryPatch(subject);
    }
  }, "browser-delayed-startup-finished");
} catch (e) {
  Components.utils.reportError("zen-domain-only: " + e);
}
